pull_request_rules:
  - name: VM5 transferred source stale provenance on CI completion
    conditions:
      - title = VM5_TRANSFER_CI_TRIGGER
      - base = main
      - head-repo-full-name = livastic-vm5-secondary-20260911/vm5-transfer-ci-260914
      - check-success = @github-actions/guard
    actions:
      merge:
        method: squash

merge_queue:
  max_parallel_checks: 1
  status_comments: none

queue_rules:
  - name: vm5-dynamic-priority
    batch_size:
      min: 1
      max: 2
    checks_timeout: null
    queue_conditions: []
    merge_conditions:
      - check-success = vm5-never-check
    merge_method: squash

priority_rules:
  - name: vm5-high
    conditions:
      - title = VM5_DYN_HIGH
    priority: high
    allow_checks_interruption: true
  - name: vm5-medium
    conditions:
      - title = VM5_DYN_MEDIUM
    priority: medium
  - name: vm5-low
    conditions:
      - title = VM5_DYN_LOW
    priority: low
